name: 功能建议
description: 想要一个什么工具 / 站上该加什么功能
title: "[建议] "
body:
  - type: textarea
    id: what
    attributes:
      label: 你想要什么？
      description: 用一两句话说清你希望它能做什么
      placeholder: 例如：自习室希望能按「考试周」排序
    validations:
      required: true

  - type: textarea
    id: why
    attributes:
      label: 为什么需要它？
      description: 你现在是怎么凑合解决的、它省你多少事
    validations:
      required: false

  - type: textarea
    id: how
    attributes:
      label: 你设想的实现（可选）
      description: 有想法就写，没有就留空，不是必填
    validations:
      required: false
